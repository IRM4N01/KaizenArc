<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset-"UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Training Arc - Gym Tracker</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
      <!--Main content area-->
        <nav id="bottom-nav">
          <button class="nav-btn active" data-screen="home-screen">Lifts</button>
          <button class="nav-btn" data-screen="programs-screen">Programs</button>
        </nav>

        <!--Screens-->
        <div id="home-screen" class="screen active">
          <h1>My Lifts</h1>
          <div id="lifts-container"></div>
          <div id="lift-detail" class="hidden">
            <button id="back-btn">← Back</button>
            <h2 id="detail-name"></h2>
            <p id="detail-max"></p>

            <table id="pct-table">
              <thead>
                <tr>
                  <th>Percentage</th>
                  <th>Weight</th>
                </tr>
              </thead>
              <tbody id="pct-body"></tbody>
            </table>

            <div id="update-max-form">
              <h3>Update 1RM</h3>
              <input type="number" id="new-max-input" placeholder="e.g. 105" />
              <button id="update-max-btn">Save New 1RM</button>
            </div>

          </div>
        </div>

        <!-- Programs screen -->
        <div id="programs-screen" class="screen hidden">
          <h1>My Programs</h1>
          <p id="no-programs-msg">No programs yet. Create one to get started.</p>
          <button id="create-program-btn">+ New Program</button>

          <div id="new-program-form" class="hidden">
            <h2>New Program</h2>
            <input type="text" id="program-name-input" placeholder="e.g Program Name" />
            <button id="save-program-btn">Save Program</button>
            <button id="cancel-program-btn">Cancel</button>
          </div>
        </div>

        <!-- Program detail screen -->
        <div id="program-detail-screen" class="screen hidden">
          <button id="back-to-programs-btn">← Programs</button>
          <h1 id="program-detail-name"></h1>
          <div id="program-days-list"></div>
          <button id="add-day-btn">+ Add Workout Day</button>

          <div id="new-day-form" class="hidden">
              <h2>New Workout Day</h2>
              <input type="text" id="day-name-input" placeholder="e.g. Push Day" />
              <button id="save-day-btn">Save Day</button>
              <button id="cancel-day-btn">Cancel</button>
          </div>

        </div>

        <!--Day detail screen-->
        <div id="day-detail-screen" class="screen hidden">
          <button id="back-to-program-detail-btn">← Back</button>
          <h1 id="day-detail-name"></h1>

          <div id="exercises-list"></div>

          <button id="add-exercise-btn">+ Add Exercise</button>
          
          <!--Exercise form-->
          <div id="add-exercise-form" class="hidden">
              <h2>Add Exercise</h2>

              <label>Is this a compound lift?</label>
              <div id="exercise-type-toggle">
                <button class="toggle-btn active" id="compound-btn">Compound</button>
                <button class="toggle-btn" id="accessory-btn">Accessory</button>"
              </div>

              <div id="compound-fields">
                <label>Lift</label>
                <select id="compound-select">
                  <option value="bench">Bench Press (1RM: 100kg)</option>
                  <option value="squat">Squat (1RM: 120kg)</option>
                  <option value="deadlift">Deadlift (1RM: 150kg)</option>
                  <option value="ohp">Overhead Press (1RM: 50kg)</option>
                </select>
              </div>

              <div id="accessory-fields" class="hidden">
                <label>Exercise Name</label>
                <input type="text" id="accessory-name-input" placeholder="e.g. Bicep Curls" />
              </div>

              <label>Warm up sets</label>
              <input type="number" id="warmup-sets-input" min="0" max="6" placeholder="0" />

              <div id="warmup-pct-fields"></div>

              <label>Working sets</label>
              <input type="number" id="working-sets-input" min="0" max="10" placeholder="e.g. 3" />

              <label>Reps per set</label>
              <input type="number" id="reps-input" min="1" max="30" placeholder="e.g. 5" />

              <div id="working-pct-field">
                <label>Working intensity</label>
                <input type="number" id="working-pct-input" min="1" max="100" placeholder="e.g. 80" />
                <span id="working-weight-display"></span>
              </div>

              <div id="accessory-weight-field" class="hidden">
                <label>Weight (kg)</label>
                <input type="number" id="accessory-weight-input" placeholder="e.g. 20" />
              </div>

              <button id="save-exercise-btn">Save Exercise</button>
              <button id="cancel-exercise-btn">Cancel</button>

          </div>
        </div>

        <!--Workout Screen-->
        <div id="workout-screen" class="screen hidden">
          <button id="back-to-program-from-workout-btn">← Back</button>
          <h1 id="workout-day-name"></h1>
          <p id="workout-progress"></p>

          <div id="workout-exercises-list"></div>

          <button id="finish-workout-btn">Finish Workout</button>
        </div>

        <script src="app.js"></script>
    </body>    
</html>
