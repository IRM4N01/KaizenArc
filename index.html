<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset-"UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Training Arc - Gym Tracker</title>
        <link rel="stylesheet" href="style.css">

        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#333333">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="default">
        <meta name="apple-mobile-web-app-title" content="Training Arc">
    </head>

    <body>
      <!--Main content area-->
        <nav id="bottom-nav">
          <button class="nav-btn active" data-screen="home-screen">Lifts</button>
          <button class="nav-btn" data-screen="programs-screen">Programs</button>
        </nav>

        <!--Screens-->
        <div id="home-screen" class="screen active">
          <h1>My Lifts</h1>
          <div id="lifts-container"></div>
          <div id="lift-detail" class="hidden">
            <button id="back-btn">← Back</button>
            <h2 id="detail-name"></h2>
            <p id="detail-max"></p>

            <table id="pct-table">
              <thead>
                <tr>
                  <th>Percentage</th>
                  <th>Weight</th>
                </tr>
              </thead>
              <tbody id="pct-body"></tbody>
            </table>

            <div id="update-max-form">
              <h3>Update 1RM</h3>
              <input type="number" id="new-max-input" placeholder="e.g. 105" />
              <button id="update-max-btn">Save New 1RM</button>
            </div>

          </div>
        </div>

        <!-- Programs screen -->
        <div id="programs-screen" class="screen hidden">
          <h1>My Programs</h1>
          <p id="no-programs-msg">No programs yet. Create one to get started.</p>
          <button id="create-program-btn">+ New Program</button>

          <div id="new-program-form" class="hidden">
            <h2>New Program</h2>
            <label>Program name</label>
            <input type="text" id="program-name-input" placeholder="e.g. Jeff Nippard PB System 3" />

            <label>Start date</label>
            <input type="date" id="program-start-date" />

            <label>Number of weeks</label>
            <input type="number" id="program-weeks-input" min="1" max="52" placeholder="e.g. 12" />

            <label>Starting bodyweight (kg)</label>
            <input type="number" id="program-start-weight" placeholder="e.g. 82.5" />

            <label>Program cover image (optional)</label>
            <input type ="file" id="program-image-input" accept="image/*" />
            <div id="program-image-preview" class="hidden">
              <div id="drag-container">
                <img id="preview-img" src="" alt="Program cover" draggable="false" />
              </div>
            </div>
            <div id="image-position-selector" class="hidden">
              <p id="drag-instruction" style="font-size:13px; color:var(--text-secondary); margin-top:8px;">Drag the image to reposition</p>
            </div>

            <button id="save-program-btn">Save Program</button>
            <button id="cancel-program-btn">Cancel</button>
          </div>
       </div>

        <!-- Program detail screen -->
        <div id="program-detail-screen" class="screen hidden">
          <button id="back-to-programs-btn">← Programs</button>
          <h1 id="program-detail-name"></h1>
          <div id="program-detail-info"></div>
          <div id="weeks-list"></div>
        </div>

        <!-- Week detail screen -->
        <div id="week-detail-screen" class="screen hidden">
          <button id="back-to-program-from-week-btn">← Back</button>
          <h1 id="week-detail-name"></h1>
          <div id="days-list"></div>
          <button id="add-day-btn">+ Add Day</button>

          <div id="new-day-form" class="hidden">
            <h2>Add Day</h2>

            <label>Day type</label>
              <div id="day-type-toggle">
                <button class="toggle-btn active" id="workout-type-btn">Workout</button>
                <button class="toggle-btn" id="rest-type-btn">Rest</button>
              </div>

            <label>Date</label>
            <input type="date" id="day-date-input" />

            <label>Notes (optional)</label>
            <input type="text" id="day-notes-input" placeholder="e.g. Push Day" />
            
            <button id="save-day-btn">Save Day</button>
            <button id="cancel-day-btn">Cancel</button>
            
          </div>
        </div>

        <!--Exercise detail screen-->
        <div id="exercise-detail-screen" class="screen hidden">
          <button id="back-to-week-btn">← Back</button>
          <h1 id="exercise-detail-name"></h1>

          <div id="exercises-list"></div>

          <button id="add-exercise-btn">+ Add Exercise</button>
    
          <!--Exercise form-->
          <div id="add-exercise-form" class="hidden">
            <h2>Add Exercise</h2>

            <label>Is this a compound lift?</label>
            <div id="exercise-type-toggle">
              <button class="toggle-btn active" id="compound-btn">Compound</button>
              <button class="toggle-btn" id="accessory-btn">Accessory</button>
            </div>

            <div id="compound-fields">
              <label>Lift</label>
                <select id="compound-select">
                </select>
            </div>

            <div id="accessory-fields" class="hidden">
              <label>Exercise name</label>
              <input type="text" id="accessory-name-input" placeholder="e.g. Bicep Curls" />
            </div>

            <label>Warm up sets</label>
            <input type="number" id="warmup-sets-input" min="0" max="6" placeholder="0" />

            <div id="warmup-pct-fields"></div>

            <label>Working sets</label>
            <input type="number" id="working-sets-input" min="0" max="10" placeholder="e.g. 3" />

            <label>Reps per set</label>
            <input type="number" id="reps-input" min="1" max="30" placeholder="e.g. 5" />

            <div id="working-pct-field">
              <label>Working intensity</label>
              <input type="number" id="working-pct-input" min="1" max="100" placeholder="e.g. 80" />
              <span id="working-weight-display"></span>
            </div>

            <div id="accessory-weight-field" class="hidden">
              <label>Weight (kg)</label>
              <input type="number" id="accessory-weight-input" placeholder="e.g. 20" />
            </div>

            <button id="save-exercise-btn">Save Exercise</button>
            <button id="cancel-exercise-btn">Cancel</button>
          </div>
        </div>

        <!--Workout Screen-->
        <div id="workout-screen" class="screen hidden">
          <button id="back-to-program-from-workout-btn">← Back</button>
          <h1 id="workout-day-name"></h1>
          <p id="workout-progress"></p>

          <div id="workout-exercises-list"></div>

          <button id="finish-workout-btn">Finish Workout</button>
        </div>

        <script src="app.js"></script>
    </body>    
</html>
